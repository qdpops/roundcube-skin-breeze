<roundcube:include file="includes/layout.html" />
<roundcube:include file="includes/menu.html" condition="!env:extwin && !env:framed" />
<roundcube:add_label name="recipientsadded" />
<roundcube:add_label name="nocontactselected" />
<roundcube:add_label name="recipient" />
<roundcube:add_label name="insert" />
<roundcube:add_label name="insertcontact" />
<roundcube:add_label name="recipientedit" />

<h1 class="voice"><roundcube:label name="compose" /></h1>

<!-- Usually shown inside the floating panel of the mail screen (framed); works as a full page too.
     No .formbuttons / data-content-button here: Elastic's ui.js would clone them into the parent window. -->
<div id="layout-content" class="selected no-navbar tw-composer" role="main">
	<div id="composestatusbar" class="tw-c-status"></div>
	<div id="compose-content" class="tw-c-content">
		<roundcube:object name="composeFormHead" role="main" class="tw-c-form" />
		<roundcube:object name="composeObjects" id="compose-objects" />
		<div id="compose-headers" class="tw-c-fields" role="region" aria-labelledby="aria-label-composeheaders">
			<h2 id="aria-label-composeheaders" class="voice"><roundcube:label name="arialabelmessageheaders" /></h2>
			<div class="compose-headers">
				<div id="compose_from" class="tw-c-row tw-c-from">
					<label for="_from"><roundcube:label name="from" /></label>
					<roundcube:object name="composeHeaders" part="from" id="_from" form="form" tabindex="1" class="tw-c-select" />
				</div>
				<div id="compose_to" class="tw-c-row">
					<label for="_to" class="voice"><roundcube:label name="to" /></label>
					<roundcube:object name="composeHeaders" part="to" id="_to" form="form" tabindex="1" aria-required="true"
						data-recipient-input="true"/>
					<a href="#add-header" data-tw-menu="headers-menu" aria-haspopup="true" aria-expanded="false" class="tw-btn tw-icon-only ti ti-more" title="<roundcube:label name="addheader" />" tabindex="1"><span class="inner"><roundcube:label name="addheader" /></span></a>
				</div>
				<div id="compose_cc" class="tw-c-row hidden">
					<label for="_cc" class="voice"><roundcube:label name="tw_folders.cc" /></label>
					<roundcube:object name="composeHeaders" part="cc" id="_cc" form="form" tabindex="1" data-recipient-input="true" />
					<a href="#delete" onclick="UI.header_reset('_cc')" class="tw-btn tw-icon-only ti ti-close" title="<roundcube:label name='delete' />" tabindex="1"><span class="inner"><roundcube:label name="delete" /></span></a>
				</div>
				<div id="compose_bcc" class="tw-c-row hidden">
					<label for="_bcc" class="voice"><roundcube:label name="tw_folders.bcc" /></label>
					<roundcube:object name="composeHeaders" part="bcc" id="_bcc" form="form" tabindex="1" data-recipient-input="true" />
					<a href="#delete" onclick="UI.header_reset('_bcc')" class="tw-btn tw-icon-only ti ti-close" title="<roundcube:label name='delete' />" tabindex="1"><span class="inner"><roundcube:label name="delete" /></span></a>
				</div>
				<div id="compose_replyto" class="tw-c-row hidden">
					<label for="_replyto" class="voice"><roundcube:label name="tw_folders.replyto" /></label>
					<roundcube:object name="composeHeaders" part="replyto" id="_replyto" form="form" tabindex="1" data-recipient-input="true" />
					<a href="#delete" onclick="UI.header_reset('_replyto')" class="tw-btn tw-icon-only ti ti-close" title="<roundcube:label name='delete' />" tabindex="1"><span class="inner"><roundcube:label name="delete" /></span></a>
				</div>
				<div id="compose_followupto" class="tw-c-row hidden">
					<label for="_followupto" class="voice"><roundcube:label name="followupto" /></label>
					<roundcube:object name="composeHeaders" part="followupto" id="_followupto" form="form" tabindex="1" data-recipient-input="true" />
					<a href="#delete" onclick="UI.header_reset('_followupto')" class="tw-btn tw-icon-only ti ti-close" title="<roundcube:label name='delete' />" tabindex="1"><span class="inner"><roundcube:label name="delete" /></span></a>
				</div>
				<div id="compose_subject" class="tw-c-row">
					<label for="compose-subject" class="voice"><roundcube:label name="subject" /></label>
					<roundcube:object name="composeSubject" id="compose-subject" form="form" tabindex="1" class="tw-c-input"/>
				</div>
			</div>
		</div>
		<div id="composebodycontainer" class="tw-c-body">
			<label for="composebody" class="voice"><roundcube:label name="arialabelmessagebody" /></label>
			<roundcube:object name="composeBody" id="composebody" form="form" cols="70" rows="20" class="form-control" tabindex="1" />
			<roundcube:if condition="!in_array('htmleditor', (array)config:dont_override)" />
				<roundcube:object name="editorSelector" id="editor-selector" editorid="composebody" noform="true" class="hidden" />
			<roundcube:endif />
		</div>
		</form>
		<div id="compose-attachments" class="tw-c-attachments file-upload" role="region" aria-labelledby="aria-label-compose-attachments">
			<h2 id="aria-label-compose-attachments" class="voice"><roundcube:label name="attachments" /></h2>
			<roundcube:object name="composeAttachmentList" id="attachment-list" class="attachmentslist" tabindex="2" />
			<roundcube:object name="fileDropArea" id="compose-attachments" />
		</div>
	</div>
	<div class="tw-c-foot">
		<span class="tw-c-send">
			<roundcube:button command="send" type="link" class="tw-send" label="send" title="sendmessage" tabindex="1" innerclass="inner" />
			<a href="#send-options" class="tw-send-more ti ti-chevron-down" data-tw-menu="tw-send-menu" aria-haspopup="true" aria-expanded="false" title="<roundcube:label name="options" />"><span class="inner"><roundcube:label name="options" /></span></a>
		</span>
		<a href="#attach" class="tw-btn tw-icon-only tw-round ti ti-paperclip" title="<roundcube:label name="addattachment" />"
			onclick="rcmail.upload_input('uploadform'); return false"><span class="inner"><roundcube:label name="addattachment" /></span></a>
		<roundcube:button command="insert-sig" type="link" class="tw-btn tw-icon-only tw-round ti ti-signature disabled" classAct="tw-btn tw-icon-only tw-round ti ti-signature"
			label="signature" title="insertsignature" tabindex="2" innerclass="inner" />
		<a href="#responses" class="tw-btn tw-icon-only tw-round ti ti-message" data-tw-menu="responses-menu" aria-haspopup="true" aria-expanded="false" title="<roundcube:label name='insertresponse' />"><span class="inner"><roundcube:label name="responses" /></span></a>
		<span class="tw-spacer"></span>
		<span class="tw-c-saved" id="tw-c-saved"></span>
		<a href="#options" class="tw-btn tw-icon-only tw-round ti ti-sliders" data-tw-menu="tw-compose-options" aria-haspopup="true" aria-expanded="false" title="<roundcube:label name="arialabelcomposeoptions" />"><span class="inner"><roundcube:label name="arialabelcomposeoptions" /></span></a>
		<roundcube:button command="extwin" type="link" label="openinextwin" title="openinextwin" class="tw-btn tw-icon-only tw-round ti ti-external" innerclass="inner" condition="!env:extwin" />
		<a href="#maximize" class="tw-btn tw-icon-only tw-round ti ti-maximize tw-qr-expand" title="<roundcube:label name="tw_folders.maximize" />"><span class="inner"><roundcube:label name="tw_folders.maximize" /></span></a>
	</div>
</div>

<!-- compose options: id compose-options is required, ui.js copies these inputs into the form -->
<div id="tw-compose-options" class="tw-menu tw-popform" hidden aria-labelledby="aria-label-composeoptions">
	<div id="compose-options" class="formcontent">
		<h3 id="aria-label-composeoptions" class="voice"><roundcube:label name="arialabelcomposeoptions" /></h3>
		<roundcube:container name="composeoptions" id="compose-options" />
		<roundcube:if condition="!in_array('mdn_default', (array)config:dont_override)" />
		<label class="tw-opt"><span><roundcube:label name="returnreceipt" /></span><roundcube:object name="mdnCheckBox" id="compose-mdn" noform="true" tabindex="2" /></label>
		<roundcube:endif />
		<roundcube:if condition="!in_array('dsn_default', (array)config:dont_override)" />
		<label class="tw-opt"><span><roundcube:label name="dsn" /></span><roundcube:object name="dsnCheckBox" id="compose-dsn" noform="true" tabindex="2" /></label>
		<roundcube:endif />
		<label class="tw-opt"><span><roundcube:label name="keepformatting" /></span><roundcube:object name="keepFormattingCheckBox" id="compose-keep-formatting" noform="true" tabindex="2" /></label>
		<label class="tw-opt tw-opt-select"><span><roundcube:label name="priority" /></span>
			<roundcube:object name="prioritySelector" id="compose-priority" noform="true" tabindex="2" class="custom-select" /></label>
		<roundcube:if condition="!config:no_save_sent_messages" />
		<label class="tw-opt tw-opt-select"><span><roundcube:label name="savesentmessagein" /></span>
			<roundcube:object name="storetarget" id="compose-store-target" noform="true" tabindex="2" class="custom-select" /></label>
		<roundcube:endif />
	</div>
</div>

<div id="tw-send-menu" class="tw-menu" hidden>
	<ul class="menu listing" role="menu">
		<roundcube:button command="savedraft" type="link-menuitem" label="savemessage" class="save disabled" classAct="save active" />
	</ul>
</div>

<roundcube:object name="composeAttachmentForm" id="uploadform" mode="smart" />

<div id="spell-menu" class="popupmenu" data-popup-init="spellmenu"></div>

<div id="headers-menu" class="tw-menu" hidden>
	<h3 id="aria-label-headersmenu" class="voice"><roundcube:label name="arialabelheadersmenu" /></h3>
	<ul class="menu listing" role="menu" aria-labelledby="aria-label-headersmenu">
		<li role="menuitem"><a data-target="cc" href="#" role="button" class="recipient active"><roundcube:label name="tw_folders.cc" /></a></li>
		<li role="menuitem"><a data-target="bcc" href="#" role="button" class="recipient active"><roundcube:label name="tw_folders.bcc" /></a></li>
		<li role="menuitem"><a data-target="replyto" href="#" role="button" class="recipient active"><roundcube:label name="tw_folders.replyto" /></a></li>
		<li role="menuitem"><a href="#add-contact" onclick="UI.recipient_selector('to')" role="button" class="active"><roundcube:label name="tw_folders.choose_contacts" /></a></li>
	</ul>
</div>

<div id="responses-menu" class="tw-menu" hidden>
	<h3 id="aria-label-responsesmenu" class="voice"><roundcube:label name="arialabelresponsesmenu" /></h3>
	<ul class="menu listing" role="menu" aria-labelledby="aria-label-responsesmenu">
		<li role="separator" class="separator"><label><roundcube:label name="insertresponse" /></label></li>
		<roundcube:object name="responseslist" id="responseslist" tagname="ul" class="rounded-0" itemclass="active" list-placeholder="noresponsesavailable" />
		<li role="separator" class="separator"><label><roundcube:label name="manageresponses" /></label></li>
		<roundcube:button name="responses" type="link-menuitem" label="editresponses" class="edit responses active" onclick="return rcmail.command('switch-task', 'settings/responses')" />
	</ul>
</div>

<div id="attachmentmenu" class="popupmenu">
	<h3 id="aria-label-attachmentmenu" class="voice"><roundcube:label name="arialabelattachmentmenu" /></h3>
	<ul class="menu listing" role="menu" aria-labelledby="aria-label-attachmentmenu">
		<roundcube:button command="open-attachment" id="attachmenuopen" type="link-menuitem" label="open" class="extwin disabled" classAct="extwin active" />
		<roundcube:button command="download-attachment" id="attachmenudownload" type="link-menuitem" label="download" class="download disabled" classAct="download active" />
		<roundcube:button command="rename-attachment" id="attachmenurename" type="link-menuitem" label="rename" class="rename disabled" classAct="rename active" />
		<roundcube:container name="attachmentmenu" id="attachmentoptionsmenu" />
	</ul>
</div>

<div id="recipient-dialog" class="popupmenu" role="region" aria-labelledby="aria-label-composecontacts">
	<div class="listbox">
		<roundcube:object name="searchform" id="searchform" wrapper="searchbar menu"
			label="contactsearchform" buttontitle="findcontacts" ariatag="h2" class="no-bs" />
		<div class="scroller" tabindex="-1">
			<roundcube:object name="addressbooks" id="directorylist" class="treelist listing iconized"
				summary="ariasummarycomposecontacts" />
			<roundcube:object name="addresslist" id="contacts-table" class="listing iconized contactlist"
				noheader="true" role="listbox" data-list="contact_list" data-list-select-replace="#recipient-dialog .pagenav-text" />
		</div>
		<roundcube:include file="includes/pagenav.html" />
	</div>
</div>

<roundcube:include file="includes/footer.html" />
